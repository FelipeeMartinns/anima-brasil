services:
  db:
    image: postgres:16-alpine
    container_name: anima_brasil_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: animacoes_brasileiras
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: