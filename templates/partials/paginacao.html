{% if page_obj and page_obj.has_other_pages %}
<nav class="mt-8 flex items-center justify-center gap-3" aria-label="Paginação">
    {% if page_obj.has_previous %}
    <a href="{{ base_pagina }}page={{ page_obj.previous_page_number }}"
       class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium">&larr; Anterior</a>
    {% endif %}
    <span class="px-3 py-2 text-sm text-slate-500">
        Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}
    </span>
    {% if page_obj.has_next %}
    <a href="{{ base_pagina }}page={{ page_obj.next_page_number }}"
       class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium">Próxima &rarr;</a>
    {% endif %}
</nav>
{% endif %}
